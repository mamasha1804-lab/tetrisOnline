<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Пять концептов витрины обучающих игр Буквапарк" />
    <title>Буквапарк — игры с алфавитом</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="clinic">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Буквапарк — на главную">
        <span class="brand__mark">Б</span>
        <span>Буквапарк</span>
      </a>
      <nav class="concept-nav" aria-label="Выбор концепта">
        <button class="concept-tab is-active" data-theme="clinic"><b>01</b> Ветклиника</button>
        <button class="concept-tab" data-theme="islands"><b>02</b> Острова</button>
        <button class="concept-tab" data-theme="city"><b>03</b> Буквоград</button>
        <button class="concept-tab" data-theme="space"><b>04</b> Космопорт</button>
        <button class="concept-tab" data-theme="lab"><b>05</b> Лаборатория</button>
      </nav>
      <button class="profile" aria-label="Профиль игрока"><span>⭐</span><b>12</b><i>М</i></button>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow"><span></span><b id="conceptNumber">КОНЦЕПТ 01</b></div>
        <div class="hero__copy">
          <h1 id="heroTitle">Лечим слова<br /><em>буква за буквой!</em></h1>
          <p id="heroText">Выбирай пациента, собирай нужные буквы и возвращай зверятам отличное настроение.</p>
        </div>
        <div class="mascot" aria-hidden="true">
          <div class="spark spark--one">✦</div><div class="spark spark--two">✦</div>
          <div class="mascot__ears"><i></i><i></i></div>
          <div class="mascot__head"><span class="eye"></span><span class="eye"></span><b></b><em></em></div>
          <div class="mascot__body"><span>+</span></div>
          <div class="mascot__shadow"></div>
        </div>
      </section>

      <section class="games" aria-labelledby="gamesTitle">
        <div class="section-heading">
          <div><span class="mini-label">ИГРОВАЯ</span><h2 id="gamesTitle">Выбери миссию</h2></div>
          <div class="progress"><span>Твой прогресс</span><div><i style="width: 58%"></i></div><b>7 / 12</b></div>
        </div>
        <div class="game-grid" id="gameGrid"></div>
      </section>
    </main>

    <dialog class="game-dialog" id="gameDialog" aria-labelledby="dialogTitle">
      <button class="dialog-close" type="button" aria-label="Закрыть игру">×</button>
      <span class="dialog-label">МИНИ-ИГРА</span>
      <h2 id="dialogTitle">Найди слово</h2>
      <p id="dialogPrompt"></p>
      <div class="answers" id="answers"></div>
      <p class="game-result" id="gameResult" aria-live="polite"></p>
    </dialog>

    <footer><span>Учимся играя каждый день</span><b>© 2026 Буквапарк</b><span>Для детей 6–9 лет</span></footer>
    <script src="app.js" defer></script>
  </body>
</html>
